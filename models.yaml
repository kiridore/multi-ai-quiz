# opencode-go 模型清单（依据 https://opencode.ai/docs/zh-cn/go，2026-08）
# api 字段：chat = OpenAI 兼容 /chat/completions；responses = OpenAI Responses /responses；
#           anthropic = Anthropic Messages /messages（x-api-key 认证）
# temperature 可选：仅 chat 族使用；推理模型（kimi-k3、kimi-k2.7-code）只接受 1，缺省=不发送该参数
# price 可选：$/1M tokens（输入/输出），用于页面标注；实时发现的模型若不在本清单则无价格
# enabled 控制页面默认勾选；默认勾选一组成本/速度均衡的模型。
# 提示：配置了 API key 后，页面模型列表会优先从 {base}/models 实时拉取（本文件提供显示名/协议/默认勾选）。
models:
  - id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    api: chat
    temperature: 0.2
    price: "$0.14/$0.28"
    enabled: true
